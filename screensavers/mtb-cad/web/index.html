<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MTB CAD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: one full-bleed canvas drawn as a CAD sheet — border with zones, viewport on the left, parts list and title block on the right. Single dark look by choice. */
  :root {
    --ground: #0d1316;
    --line: #d2dadd;
    --shadow: rgba(0, 0, 0, 0.5);
    --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--ground); overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  body.idle, body.idle canvas { cursor: none; }
  .hint {
    position: fixed; top: calc(40px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%);
    font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--line); text-shadow: 0 1px 6px var(--shadow); background: var(--ground); padding: 4px 10px;
    pointer-events: none; transition: opacity 1.5s ease; white-space: nowrap;
  }
  .fade { opacity: 0; }
</style>

<canvas id="c" aria-label="Animated screensaver: a CAD drawing of a mountain bike that separates into an exploded view of numbered parts and reassembles" role="img"></canvas>
<div class="hint" id="hint">Click for full screen · H hides the tables</div>

<script>
(() => {
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FONT = '"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace';

/* ---------- CAD layers ---------- */
const C = {
  ground: '#0d1316',
  line: '#d2dadd',                       // object lines
  thin: 'rgba(210,218,221,0.5)',          // secondary object lines
  dim: '#7fa3b0',                         // dimensions, balloons, annotation
  dimA: a => `rgba(127,163,176,${a})`,
  center: '#a39478',                      // centre lines and phantom lines
  centerA: a => `rgba(163,148,120,${a})`,
  grid: 'rgba(127,163,176,0.06)',
  border: 'rgba(210,218,221,0.6)',
};
const DASH_CENTER = [16, 3, 3, 3], DASH_PHANTOM = [18, 3, 3, 3, 3, 3];

let W, H, dpr, S, S0 = 1, zoom = 1, U = 1, A, wide, panel, showTables = true;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  wide = W >= 900 && W / H > 1.15;
  const mo = W < 600 ? 8 : 12, mi = W < 600 ? 22 : 30;
  frameR = { mo, mi };
  const fx0 = mi, fy0 = mi, fx1 = W - mi, fy1 = H - mi;
  if (wide) {
    const T = Math.max(300, Math.min(360, W * 0.21));
    panel = { x0: fx1 - T, x1: fx1, y0: fy0, y1: fy1 };
    A = { x: fx0 + 10, y: fy0 + 10, w: panel.x0 - fx0 - 20, h: fy1 - fy0 - 20 };
  } else {
    panel = { x0: fx0, x1: fx1, y0: fy1 - 62, y1: fy1 };
    A = { x: fx0 + 6, y: fy0 + 6, w: fx1 - fx0 - 12, h: panel.y0 - fy0 - 12 };
  }
  A.cx = A.x + A.w / 2; A.cy = A.y + A.h / 2;
  S0 = Math.min(A.w * 0.88 / 2120, A.h * 0.88 / 1400); S = S0 * zoom;
  layoutSlots();
}
let frameR;

/* ---------- drawing helpers (millimetres, bike space, y up) ---------- */
const px = n => n * U;
const lerp = (a, b, t) => a + (b - a) * t;
const lerp2 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t)];
const along = (a, dir, d) => [a[0] + dir[0] * d, a[1] + dir[1] * d];
const unit = (a, b) => { const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy); return [dx / l, dy / l, l]; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
function seg(a, b, w, col) { ctx.strokeStyle = col; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); }
function ring(c, r, w, col) { ctx.strokeStyle = col; ctx.lineWidth = w; ctx.beginPath(); ctx.arc(c[0], c[1], r, 0, Math.PI * 2); ctx.stroke(); }
function disc(c, r, col) { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(c[0], c[1], r, 0, Math.PI * 2); ctx.fill(); }
// solid outline shape: filled with ground (hides what is behind), edged with object line
function shape(build, edge = 1.3) { ctx.beginPath(); build(); ctx.fillStyle = C.ground; ctx.fill('evenodd'); ctx.strokeStyle = C.line; ctx.lineWidth = px(edge); ctx.stroke(); }
function circ(c, r, edge = 1.3) { shape(() => ctx.arc(c[0], c[1], r, 0, Math.PI * 2), edge); }
// tubes drawn as two edges: wide object line, then ground core
function tubes(list, cap = 'round') {
  ctx.lineCap = cap;
  for (const [a, b, w] of list) seg(a, b, w + px(2.6), C.line);
  for (const [a, b, w] of list) seg(a, b, w, C.ground);
  ctx.lineCap = 'round';
}
function strokeOutlined(build, w) {
  ctx.beginPath(); build(); ctx.strokeStyle = C.line; ctx.lineWidth = w + px(2.4); ctx.stroke();
  ctx.strokeStyle = C.ground; ctx.lineWidth = w; ctx.stroke();
}
function centerMark(r) {
  ctx.save(); ctx.setLineDash(DASH_CENTER.map(px)); ctx.strokeStyle = C.center; ctx.lineWidth = px(0.8);
  ctx.beginPath(); ctx.moveTo(-r, 0); ctx.lineTo(r, 0); ctx.moveTo(0, -r); ctx.lineTo(0, r); ctx.stroke(); ctx.restore();
}

/* ---------- bike geometry (mm). Rear axle at origin. 29er, 65° head angle, 44 mm fork offset ---------- */
const HA = 65 * Math.PI / 180, HDIR = [Math.cos(HA), -Math.sin(HA)], HPERP = [Math.sin(HA), Math.cos(HA)];
const REAR = [0, 0], BB = [440, -30];
// 600 mm axle-to-crown (real 160 mm 29er forks run ~580-600) so the tyre clears the crown and down tube at full travel.
// The head tube sits on the same steering axis, raised along it, so the wheelbase and head angle don't change.
const FORK_EXT = 120, FX_OFF = [-HDIR[0] * FORK_EXT, -HDIR[1] * FORK_EXT], FX = p => [p[0] + FX_OFF[0], p[1] + FX_OFF[1]];
const HT_TOP = FX([985, 560]), HT_BOT = along(HT_TOP, HDIR, 150), CROWN = along(HT_TOP, HDIR, 160);
const FRONT = (() => { const t = (CROWN[1] + 44 * HPERP[1]) / -HDIR[1]; const p = along(along(CROWN, HDIR, t), HPERP, 44); return [Math.round(p[0]), 0]; })();
const ST = [325, 480], TT_END = along(HT_TOP, HDIR, 40), DT_END = along(HT_TOP, HDIR, 118);
const PIVOT = [470, 40], ROCK = [[360, 300], [400, 262], [478, 326]];
const SHOCK_A = [640, 135], SHOCK_B = ROCK[2];
const POST_DIR = (() => { const u = unit(BB, ST); return [u[0], u[1]]; })();
const SEAT_ANGLE = Math.atan2(ST[1] - BB[1], BB[0] - ST[0]) * 180 / Math.PI;

const SHOCK_L0 = unit(SHOCK_A, ROCK[2])[2];
const FORK_DIR = (() => { const u = unit(CROWN, FRONT); return [u[0], u[1]]; })();
const rotAbout = (p, c, a) => { const dx = p[0] - c[0], dy = p[1] - c[1]; return [c[0] + dx * Math.cos(a) - dy * Math.sin(a), c[1] + dx * Math.sin(a) + dy * Math.cos(a)]; };

/* ---------- ride simulation (mm, s): sprung frame with heave + pitch on two spring-dampers ---------- */
const COMB = [647, 0], GRAV = 9810, V = 3000, SLOWMO = 0.55, R_TIRE = 385;
const TRAVEL_F = 160, TRAVEL_R = 150, SAG_F = 48, SAG_R = 45;
const KF = GRAV / (2 * SAG_F), KR = GRAV / (2 * SAG_R), DAMP = 7.5, RG2 = 260000;
const ride = { X: 0, v: V, z: 0, vz: 0, th: 0, vth: 0, sf: SAG_F, sr: SAG_R, camZ: 0, trail: null, segs: [] };
let camX = 0, camZ = 0, camFrom = [0, 0], crashZoom = 1, debris = [], tb = null;
function rideReset(baseY = 0) { ride.v = V; ride.z = baseY + R_TIRE - (SAG_F + SAG_R) / 2; ride.vz = 0; ride.th = 0; ride.vth = 0; ride.sf = SAG_F; ride.sr = SAG_R; ride.camZ = ride.z; ride.cf = ride.cr = baseY + R_TIRE; }
rideReset();
let trailSeed = 1;
const hs2 = n => { const s = Math.sin(n * 127.1 + 917.3) * 43758.5453; return s - Math.floor(s); }; // fixed seed (soil stones)
const hsh = n => { const s = Math.sin(n * 127.1 + trailSeed * 311.7) * 43758.5453; return s - Math.floor(s); };
// piecewise-linear value noise: straight facets between random heights, so the profile reads as broken ground
const lin = (u, cell, k) => { const i = Math.floor(u / cell), f = u / cell - i; return lerp(hsh(i * 7.13 + k), hsh((i + 1) * 7.13 + k), f) * 2 - 1; };
const rough = u => 105 * lin(u, 2100, 1) + 55 * lin(u, 700, 2) + 27 * lin(u, 230, 3) + 12 * lin(u, 85, 4) + 5 * lin(u, 31, 5);
const GRADE = 0.07; // the trail falls 7 %
function rockH(u, T) { // angular rocks: steep face, broken top, back slope
  if (!T || u <= 0 || u >= T.len) return 0;
  trailSeed = T.seed;
  const env = smooth(0, 1500, u), cell = 850, k = Math.floor(u / cell);
  let h = 0;
  for (let j = k - 1; j <= k + 1; j++) {
    if (j < 2 || hsh(j + 0.11) < 0.45 || j * cell > T.len - 2300) continue;
    const w1 = 90 + hsh(j + 0.3) * 130, wt = 70 + hsh(j + 0.5) * 260, w2 = 90 + hsh(j + 0.7) * 220;
    const s0 = j * cell + hsh(j + 0.9) * cell * 0.4, hr = (hsh(j + 1.3) < 0.3 ? 35 + hsh(j + 1.7) * 30 : 75 + hsh(j + 1.1) * 95) * env;
    const d = u - s0;
    if (d > 0 && d < w1 + wt + w2) {
      const top = hr * (1 + 0.18 * lin(d, 45, j * 3.1));
      h += d < w1 ? top * (d / w1) : d < w1 + wt ? top * (1 - 0.15 * (d - w1) / wt) : top * 0.85 * (1 - (d - w1 - wt) / w2);
    }
  }
  return h;
}
function trailH(u, T) {
  trailSeed = T.seed;
  const env = smooth(0, 1500, u), calm = 1 - 0.65 * smooth(T.len - 2600, T.len - 1700, u);
  let h = -GRADE * Math.max(0, u - 1200) + env * calm * rough(u) + rockH(u, T);
  h -= 0.22 * clamp(u - (T.len - 7000), 0, 4200);                 // steep chute before the run-in to the kicker
  h += 230 * clamp((u - (T.len - 1500)) / 1450, 0, 1);         // straight slab kicker before the drop
  return h;
}
// The trail is a chain of segments; each starts flat at the height where the last one ended:
// flat lead-in, rough descending trail, kicker, craggy cliff, boulder, then a flat run-out.
const LEAD = 3000;
function segAt(x) { const g = ride.segs; for (let i = g.length - 1; i >= 0; i--) if (x >= g[i].s) return g[i]; return null; }
function groundH(x) {
  const T = segAt(x); if (!T) return ride.segs.length ? ride.segs[0].y0 : 0;
  trailSeed = T.seed;
  const u = x - T.start; if (u <= 0) return T.y0;
  if (u < T.len) return T.y0 + trailH(u, T);
  const top = trailH(T.len, T), bottom = top - T.drop, v = u - T.len;
  if (v < FACE) { // craggy cliff face: broken steps and spikes on the way down
    const t = v / FACE, crag = (110 * lin(v, 75, 9) + 50 * lin(v, 29, 10) + 20 * lin(v, 12, 11)) * Math.sin(Math.PI * Math.min(1, t * 1.15));
    return T.y0 + lerp(top, bottom, Math.pow(t, 0.6)) + crag;
  }
  return T.y0 + belowCliff(u, v, bottom, T) + boulderTop(v, T);
}
const FACE = 1000;
const belowCliff = (u, v, bottom, T) => { const R = runout(T), k = 1 - smooth(R, R + 1200, v); return bottom - GRADE * (Math.min(v, R + 600) - FACE) + 0.7 * rough(u) * k; };
// a big angular boulder in the landing zone (offsets in mm from the lip; heights above the ground it sits in)
const BX_OFFSET = -250; // aim the boulder's leading face at the predicted touchdown
const BOULDER_X = 2050, BOULDER = [[0, 0], [60, 150], [120, 250], [175, 270], [250, 400], [340, 455], [430, 470], [520, 440], [600, 455], [690, 360], [780, 230], [860, 120], [930, 0]];
// the boulder sits where the bike will land: placed at takeoff from the bike's speed (T.bx), default BOULDER_X
const runout = T => (T.bx || BOULDER_X) + 930 + 400; // ground flattens out past the boulder
function boulderTop(v, T) {
  const d = v - (T.bx || BOULDER_X); if (d <= 0 || d >= 930) return 0;
  let i = 0; while (BOULDER[i + 1][0] < d) i++;
  const [x0, y0] = BOULDER[i], [x1, y1] = BOULDER[i + 1];
  return lerp(y0, y1, (d - x0) / (x1 - x0));
}
function contactY(x) { // height of the wheel centre resting on the ground under x
  let m = -1e9;
  for (let i = -12; i <= 12; i++) { const dx = i / 12 * R_TIRE * 0.92, y = groundH(x + dx) + Math.sqrt(R_TIRE * R_TIRE - dx * dx); if (y > m) m = y; }
  return m;
}
function rideStep(h) {
  if (!(h > 0)) return;
  const c =Math.cos(ride.th), s = Math.sin(ride.th);
  const fa = [ride.X + 648 * c, ride.z + 648 * s], ra = [ride.X - 647 * c, ride.z - 647 * s];
  // tire give: the contact the suspension feels follows the ground with a short lag (rises softly, drops freely)
  const tf = contactY(fa[0]), tr = contactY(ra[0]), tc = Math.min(1, h / 0.03);
  ride.cf = tf < ride.cf ? tf : ride.cf + (tf - ride.cf) * tc;
  ride.cr = tr < ride.cr ? tr : ride.cr + (tr - ride.cr) * tc;
  const sf = ride.cf - fa[1], sr = ride.cr - ra[1];
  const force = (sNow, sPrev, k, trav) => {
    if (sNow <= 0) return 0;
    const ds = sPrev > 0 ? (sNow - sPrev) / h : 0;
    // light compression damping, firmer rebound, and a blow-off cap so sharp edges don't kick the frame
    const damp = clamp((ds > 0 ? 0.7 : 2.6) * Math.sqrt(k) * ds, -0.7 * GRAV, 0.7 * GRAV);
    return Math.max(0, k * sNow + damp + (sNow > trav ? 40 * k * (sNow - trav) : 0));
  };
  const Ff = force(sf, ride.sf, KF, TRAVEL_F), Fr = force(sr, ride.sr, KR, TRAVEL_R);
  ride.vz += (Ff + Fr - GRAV) * h;
  if (Ff > 0 && Fr > 0) ride.vz *= 1 - 2.5 * h;                // rider's legs soak up heave while both wheels are down
  ride.z += ride.vz * h;
  ride.vth += ((Ff * 648 - Fr * 647) * c / RG2) * h; ride.vth *= 1 - (Ff > 0 && Fr > 0 ? 6 : 1.5) * h; ride.th = clamp(ride.th + ride.vth * h, -0.45, 0.45);
  // keep both tires on the ground while riding: if the ground falls away faster than the fork or shock can
  // extend, the rider weights that end and the frame follows it down. Only past the kicker lip can a wheel leave.
  const lip = ride.trail ? ride.trail.start + ride.trail.len - 30 : Infinity, L = 1295;
  // A wheel that has just rolled off the crest of a rock may float briefly (up to 60 mm) before it touches down.
  const offRock = x => { const T = ride.trail; if (!T) return 0; const u = x - T.start, g = rockH(u, T); let top = g; for (let k = 1; k <= 8; k++) top = Math.max(top, rockH(u - k * 50, T)); return top - g > 110 ? Math.min(60, (top - g) * 0.45) : 0; };
  let gf = sf, gr = sr;

    const allow = offRock(fa[0]);
    if (gf < -allow) {
      const d = -gf - allow; ride.z -= d * 647 / L; ride.th -= d / L; gf = -allow;
      const v = ride.vz + 648 * ride.vth; if (v > 0) { ride.vz -= v * 647 / L; ride.vth -= v / L; }
    }
  }
  if (ra[0] < lip && gr < 0) {
    const allow = offRock(ra[0]);
    if (gr < -allow) {
      const d = -gr - allow; ride.z -= d * 648 / L; ride.th += d / L; gr = -allow;
      const v = ride.vz - 647 * ride.vth; if (v > 0) { ride.vz -= v * 648 / L; ride.vth += v / L; }

  if (Ff > 0 || Fr > 0) {
    const slope = (groundH(ride.X + 600) - groundH(ride.X - 600)) / 1200;
    ride.v = clamp(ride.v + (-GRAV * slope * 0.9 + (V - ride.v) * 0.35) * h, 1500, 9000);
  }
  ride.sf = gf; ride.sr = gr; ride.X += ride.v * h;
}
// run the ride physics ahead on a copy of the state (no boulder) to find where the front wheel lands
function predictTouchdown(cliff, T) {
  const keys = ['X', 'v', 'z', 'vz', 'th', 'vth', 'sf', 'sr', 'cf', 'cr'], saved = keys.map(k => ride[k]);
  T.bx = 1e7; let at = 2600;
  for (let i = 0; i < 1500; i++) {
    rideStep(0.001);
    const fx = ride.X + 648 * Math.cos(ride.th);

}
function pose() {
  const tf = clamp(ride.sf, 0, TRAVEL_F), tr = clamp(ride.sr, 0, TRAVEL_R), phi = -tr / 470, psi = 2 * phi;
  return { tf, tr, phi, front: along(FRONT, FORK_DIR, -tf), rear: rotAbout(REAR, PIVOT, phi),
    rock0: rotAbout(ROCK[0], ROCK[1], psi), rock2: rotAbout(ROCK[2], ROCK[1], psi) };

let wheelRot = 0, crank = 0, time = 0, P = pose();

function drawWheel(front) {
  shape(() => { ctx.arc(0, 0, 382, 0, Math.PI * 2); ctx.arc(0, 0, 318, 0, Math.PI * 2, true); }, 1.4);
  ctx.strokeStyle = C.line; ctx.lineWidth = px(1); ctx.beginPath();
  const n = front ? 46 : 42;
  for (let i = 0; i < n; i++) {
    const a = wheelRot + i * Math.PI * 2 / n, r1 = i % 2 ? 392 : 388, da = 0.022;
    ctx.moveTo(Math.cos(a - da) * 382, Math.sin(a - da) * 382); ctx.lineTo(Math.cos(a - da) * r1, Math.sin(a - da) * r1);

  ring([0, 0], 305, px(1.1), C.line); ring([0, 0], 292, px(0.8), C.thin);
  ctx.strokeStyle = C.thin; ctx.lineWidth = px(0.6); ctx.beginPath();

    const a = wheelRot + i * Math.PI * 2 / 32, b = a + (i % 2 ? 0.32 : -0.32);
    ctx.moveTo(Math.cos(a) * 34, Math.sin(a) * 34); ctx.lineTo(Math.cos(b) * 291, Math.sin(b) * 291);

function drawRotor(R) {
  ctx.save(); ctx.rotate(wheelRot);

  for (let i = 0; i < 24; i++) { const a = i * Math.PI * 2 / 24; ring([Math.cos(a) * R * 0.89, Math.sin(a) * R * 0.89], R * 0.034, px(0.7), C.thin); }

    const a = i * Math.PI / 3;

      ctx.moveTo(Math.cos(a) * R * 0.24, Math.sin(a) * R * 0.24);
      ctx.quadraticCurveTo(Math.cos(a + 0.35) * R * 0.55, Math.sin(a + 0.35) * R * 0.55, Math.cos(a + 0.5) * R * 0.79, Math.sin(a + 0.5) * R * 0.79);
    }, R * 0.06);
  }
  circ([0, 0], R * 0.24, 1.1);
  for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3 + 0.5; ring([Math.cos(a) * R * 0.17, Math.sin(a) * R * 0.17], R * 0.025, px(0.7), C.line); }

  centerMark(R * 1.15);
}
const COGS = [10, 12, 14, 16, 18, 21, 24, 28, 32, 36, 42, 52];
function drawCassette() {
  ctx.save(); ctx.rotate(wheelRot);
  circ([0, 0], 52 * 2.02 + 5, 1.2);
  for (let i = COGS.length - 1; i >= 0; i--) ring([0, 0], COGS[i] * 2.02, px(i % 2 ? 0.7 : 1), i % 2 ? C.thin : C.line);
  ctx.strokeStyle = C.line; ctx.lineWidth = px(0.8); ctx.beginPath();
  for (let k = 0; k < 52; k++) { const a = k * Math.PI * 2 / 52, r = 52 * 2.02 + 5; ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r); ctx.lineTo(Math.cos(a) * (r + 5), Math.sin(a) * (r + 5)); }
  ctx.stroke();

}
function drawCrankset() {
  const N = 32, r = N * 2.02;
  ctx.save(); ctx.rotate(crank);
  shape(() => {
    for (let k = 0; k < N * 2; k++) { const a = k * Math.PI / N, rr = k % 2 ? r - 4 : r + 6; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }

  const bottom = ty - 0, fsz = rowH >= 17 ? 10 : 9;
  ctx.textBaseline = 'middle';
  const rowAt = i => bottom - (i + 1) * rowH;
  const highlight = a < 0.02;
  PARTS.forEach((p, i) => {
    const y = rowAt(i);
    for (let k = 0; k < 4; k++) { ctx.strokeStyle = C.border; ctx.lineWidth = 1; ctx.strokeRect(cx[k] + 0.5, y + 0.5, cw[k], rowH); }
    ctx.font = `500 ${fsz}px ${FONT}`; ctx.fillStyle = C.dim; ctx.textAlign = 'center'; ctx.fillText(String(p.item), cx[0] + cw[0] / 2, y + rowH / 2 + 0.5);
    ctx.textAlign = 'left'; ctx.fillStyle = C.line; ctx.fillText(p.name.toUpperCase(), cx[1] + 6, y + rowH / 2 + 0.5);
    ctx.font = `400 ${fsz}px ${FONT}`; ctx.fillStyle = C.thin; ctx.fillText(p.spec, cx[2] + 6, y + rowH / 2 + 0.5);
    ctx.textAlign = 'center'; ctx.fillStyle = C.line; ctx.fillText('1', cx[3] + cw[3] / 2, y + rowH / 2 + 0.5);
  });
  const hy = rowAt(PARTS.length);
  ['ITEM', 'DESCRIPTION', 'SPECIFICATION', 'QTY'].forEach((t, k) => {
    ctx.strokeStyle = C.border; ctx.strokeRect(cx[k] + 0.5, hy + 0.5, cw[k], rowH);
    ctx.font = `500 8px ${FONT}`; ctx.fillStyle = C.dim; ctx.textAlign = k === 0 || k === 3 ? 'center' : 'left';
    ctx.fillText(t, k === 0 || k === 3 ? cx[k] + cw[k] / 2 : cx[k] + 6, hy + rowH / 2 + 0.5);
  });
  ctx.font = `500 9px ${FONT}`; ctx.fillStyle = C.dim; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
  ctx.fillText('PARTS LIST', x0 + 6, hy - 4);
  // notes at the top of the panel
  const ny = y0 + 18;
  if (hy - ny > 70) {
    ctx.textBaseline = 'top'; ctx.fillStyle = C.dim; ctx.font = `500 9px ${FONT}`; ctx.fillText('NOTES', x0 + 6, ny);
    ctx.fillStyle = C.thin; ctx.font = `400 9px ${FONT}`;
    ['1. ALL DIMENSIONS IN MM UNLESS NOTED.', '2. GEOMETRY SHOWN AT 30% SAG.', '3. TORQUE AXLES TO SPEC BEFORE RIDING.']
      .forEach((t, i) => ctx.fillText(t, x0 + 6, ny + 16 + i * 14));
  }
}

/* ---------- loop ---------- */
const hint = document.getElementById('hint');
let last = performance.now();
addEventListener('resize', resize); resize(); shuffleSlots(); setState('ride');

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000) * (reduced ? 0.4 : 1);
  last = now; time += dt;
  st += dt;
  if (state === 'crash' && st >= DUR.crash) setState('reassemble');
  else if (state === 'reassemble' && st >= DUR.reassemble) setState('ride');
  if (state === 'ride') {
    const n = 10, h = dt * SLOWMO / n, cliff = ride.trail.start + ride.trail.len;
    let landed = null;
    for (let i = 0; i < n; i++) {
      const vz = ride.vz;
      rideStep(h);
      const fx = ride.X + 648 * Math.cos(ride.th), T = ride.trail;
      if (!T.bxSet && fx > cliff) { // takeoff: put the boulder where the front wheel is going to come down
        T.bx = clamp(predictTouchdown(cliff, T) + BX_OFFSET, FACE + 300, 9000); T.bxSet = true;
      }
      // crash: the front wheel's first touchdown after going off the drop (it lands nose-first on the boulder)
      if (fx > cliff + 520 && ride.sf > 0) { landed = { vz: vz / 1000, pitch: Math.round(ride.th * 180 / Math.PI) }; break; }
    }
    const lead = Math.min(0, ride.vz) * 0.3;                   // look ahead when falling
    ride.camZ += (ride.z + lead - ride.camZ) * Math.min(1, dt * 4);
    ride.camZ = clamp(ride.camZ, ride.z - 700, ride.z + 250); // never let the bike leave the viewport
    camX = ride.X; camZ = ride.camZ;
    if (landed) {
      P = pose();
      crash = { w: bikeWorld([P.front[0] + R_TIRE * 0.7, P.front[1] - R_TIRE * 0.3]), t0: time, ...landed };
      setState('crash');
    } else if (st > RIDE_TIMEOUT) { crash = { w: bikeWorld([P.front[0], P.front[1] - R_TIRE]), t0: time, vz: 0, pitch: 0 }; setState('crash'); }
  } else if (state === 'crash') {
    const speed = st < 0.08 ? 0.1 : 1.0;                    // a beat on the impact, then real time
    const n = 10, h = dt * speed / n;
    for (let i = 0; i < n; i++) { crashStep(h); debrisStep(h); }
    let x0 = Infinity, x1 = -Infinity, my = 0; for (const p of PARTS) { x0 = Math.min(x0, p.b.x); x1 = Math.max(x1, p.b.x); my += p.b.y / PARTS.length; }
    const k = Math.min(1, dt * 1.6); camX += ((x0 + x1) / 2 - camX) * k; camZ += (my + 150 - camZ) * k; // frame the whole wreck
    const fit = clamp(A.w * 0.9 / ((x1 - x0 + 1100) * S0), 0.24, 0.85);   // zoom out far enough to see every part
    crashZoom += (fit - crashZoom) * Math.min(1, dt * 2.5);
  } else {
    const e = ease(Math.min(1, st / DUR.reassemble));
    camX = lerp(camFrom[0], ride.X, e); camZ = lerp(camFrom[1], ride.camZ, e);
  }
  // camera shake: a hard jolt at impact that dies away
  if (state === 'crash') { const m = 22 * Math.exp(-st * 5) * (st < 1.2 ? 1 : 0); shake = [(Math.random() - 0.5) * 2 * m, (Math.random() - 0.5) * 2 * m]; }
  else shake = [0, 0];
  const a = assembly();
  P = pose();
  wheelRot -= dt * (state === 'ride' ? ride.v * SLOWMO / R_TIRE : state === 'reassemble' ? 1.2 * a : 0);
  crank -= dt * (state === 'ride' ? 3.4 : 0);
  const introAl = state === 'ride' ? smooth(0.3, 1.1, st) * (1 - smooth(3.3, 3.8, st)) : 0; // labels + dims on the still bike, before the trail
  // on wide screens the intro is drawn smaller to leave room for the label columns, then zooms in for the ride
  const zi = wide ? clamp((A.w - 2 * 175) / ((FRONT[0] + 840) * S0), 0.5, 0.75) : 1;
  zoom = state === 'reassemble' ? lerp(crashZoom, zi, a) : state === 'ride' ? lerp(zi, 1, smooth(3.6, 4.5, st)) * lerp(1, FALL_ZOOM, smooth(-1800, 200, ride.X - ride.trail.start - ride.trail.len)) // pull back for the drop
    : crashZoom;
  S = S0 * zoom;
  const dimAl = introAl;

  drawSheet();
  drawParts(a);
  ctx.save(); ctx.beginPath(); ctx.rect(A.x, A.y, A.w, A.h); ctx.clip(); drawAssemblyCallouts(introAl); ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.rect(A.x, A.y, A.w, A.h); ctx.clip(); drawDims(dimAl); ctx.restore();
  if (showTables || !wide) drawTables(a);
  requestAnimationFrame(frame);
}
requestAnimationFrame(t => { last = t; frame(t); });

/* ---------- screensaver behaviour ---------- */
setTimeout(() => hint.classList.add('fade'), 5000);
let idleT;
function poke() { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add('idle'), 2500); }
addEventListener('mousemove', poke); poke();
addEventListener('click', () => {
  try {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {});
    else document.exitFullscreen?.().catch(() => {});
  } catch (e) {}
});
addEventListener('keydown', e => {
  if (e.key === 'h' || e.key === 'H') {
    showTables = !showTables;
    if (wide) { // give the drawing the whole sheet while the tables are hidden
      const mi = frameR.mi;
      if (!showTables) { A = { x: mi + 10, y: mi + 10, w: W - 2 * mi - 20, h: H - 2 * mi - 20 }; A.cx = A.x + A.w / 2; A.cy = A.y + A.h / 2; S0 = Math.min(A.w * 0.88 / 2120, A.h * 0.88 / 1400); S = S0 * zoom; layoutSlots(); }
      else resize();
    }
  }
});
async function wake() { try { await navigator.wakeLock?.request('screen'); } catch (e) {} }
wake(); document.addEventListener('visibilitychange', () => { if (!document.hidden) wake(); });
})();
</script>
